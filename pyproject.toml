[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventforge"
version = "0.1.0"
description = "Observer + pub-sub + RPC + work-queue primitives, one package."
authors = [{ name = "Adnan Harun Dogan", email = "adnanharundogan@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "observer-pattern",
    "pubsub",
    "rpc",
    "work-queue",
    "messaging",
    "events",
    "dispatcher",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0;python_version<'3.10'",
]

[project.optional-dependencies]
# Pydantic Logfire span emission from LogfireMeter / LogfireMetricLogger.
logfire = ["logfire>=1.0.0"]
# Optional pub/sub transport backends.
redis = ["redis>=5.0"]
nats = ["nats-py>=2.0"]
# Dev / test
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "build",
    "twine",
    "redis>=5.0",
    "fakeredis",
    "nats-py>=2.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/adnanhd/eventforge"
Repository = "https://github.com/adnanhd/eventforge"
Issues = "https://github.com/adnanhd/eventforge/issues"
Changelog = "https://github.com/adnanhd/eventforge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["eventforge*"]

[tool.setuptools.package-data]
eventforge = ["py.typed"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = true

# redis ships its own (incomplete) types: PubSub.psubscribe/punsubscribe are
# declared as ``(*args, **kwargs)`` -- untyped -- which trips ``no-untyped-call``
# under strict. Scope the relaxation to just this module (not a blanket ignore,
# and not ``ignore_missing_imports`` which would not apply since the import
# resolves with types).
[[tool.mypy.overrides]]
module = ["eventforge.transports.redis"]
disable_error_code = ["no-untyped-call"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
