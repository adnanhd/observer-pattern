name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check eventforge/ tests/ examples/

      - name: Format check with ruff
        run: ruff format --check eventforge/ tests/ examples/

      # mypy strict is aspirational for now: the codebase predates strict
      # typing and still has ~119 errors. Kept running (signal stays visible)
      # but non-blocking until a dedicated typing pass lands. Flip to blocking
      # by removing continue-on-error once the count reaches zero.
      - name: Type-check with mypy
        run: mypy eventforge/
        continue-on-error: true

      - name: Tests with pytest + coverage
        run: pytest tests/ --cov=eventforge/ --cov-report=term-missing
