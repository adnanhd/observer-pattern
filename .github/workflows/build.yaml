name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check eventforge/ tests/ examples/

      - name: Format check with black
        run: black --check eventforge/ tests/ examples/

      - name: Type-check with mypy
        run: mypy eventforge/

      - name: Tests with pytest + coverage
        run: pytest tests/ --cov=eventforge/ --cov-report=term-missing
