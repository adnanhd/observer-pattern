name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Read version
        id: meta
        run: |
          version=$(python -c "exec(open('eventforge/__init__.py').read()); print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "eventforge version: $version"

      - name: Sanity-check version vs tag
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF##*/v}"
          pkg_version="${{ steps.meta.outputs.version }}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag v$tag_version does not match eventforge/__init__.py $pkg_version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check artefacts
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/eventforge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF##refs/tags/}"
          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes-from-tag \
            --verify-tag
